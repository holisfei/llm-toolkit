[project]
name = "llm-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.26.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"   # 自动把 async def test_xxx 当 async 测试,不用每个加装饰器

[tool.ruff]
target-version = "py313"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "A"]

# cli
[project.scripts]
llm-toolkit = "llm_toolkit.cli:main"

# 把项目升级为 Package
[tool.uv]
package = true

# 打包方式
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling包路径
[tool.hatch.build]
packages = ["src/llm_toolkit"]
